services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: docpipe
      POSTGRES_PASSWORD: docpipe
      POSTGRES_DB: docpipe
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpipe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # The API owns schema migration; the worker must not race it.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg://docpipe:docpipe@db:5432/docpipe
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # Uploaded files: written by the API, read by the worker.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg://docpipe:docpipe@db:5432/docpipe
      # The worker is the only service that calls the LLM.
      # Passed through empty when unset so `docker compose down`/`ps` still
      # work; a missing key then surfaces as a clear auth failure on the
      # document rather than a compose parse error.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Only needed for identity-linked keys.
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5}
      # Retry-path testing. Off unless set in the shell, e.g.
      #   LLM_FAULT_MODE=always docker compose up -d worker
      LLM_FAULT_MODE: ${LLM_FAULT_MODE:-off}
      LLM_FAULT_ATTEMPTS: ${LLM_FAULT_ATTEMPTS:-2}
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # next.config.ts proxies /api/* here, so the browser only ever talks to
      # the Next server and there is no CORS setup anywhere.
      API_URL: http://backend:8000
    volumes:
      # Only source and config are mounted — mounting the whole directory would
      # shadow the image's node_modules with the host's.
      - ./frontend/src:/app/src
      - ./frontend/next.config.ts:/app/next.config.ts
    depends_on:
      - backend

volumes:
  db_data:
